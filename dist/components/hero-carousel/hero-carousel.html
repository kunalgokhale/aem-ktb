<div
  class="hero-carousel"
  data-autoplay="false"
  data-interval="6000"
  role="region"
  aria-roledescription="carousel"
  aria-label="Hero carousel"
>
  <div class="hc-track">
    <!-- Slide 1 -->
    <article class="hc-slide is-active">
      <div class="hc-media" aria-hidden="true">
        <img
          class="hidden-xs"
          src="../assets/images/hero-carousel-1.jpg"
          alt="Krungthai – 100 Prestigious Accolades"
        />
        <img
          class="visible-xs"
          src="../assets/images/hero-carousel-1-mobile.jpg"
          alt="Digital Banking Innovation"
        />
      </div>
      <div class="custom-container">
        <div class="hc-content">
          <h2 class="hc-heading">Celebrating Global Awards</h2>
          <p class="hc-subheading">
            Making History Toward 60 Years of Sustainable Excellence
          </p>
          <a href="#" class="hc-cta button button-primary">See the details</a>
        </div>
      </div>
    </article>

    <!-- Slide 2 (example) -->
    <article class="hc-slide">
      <div class="hc-media" aria-hidden="true">
        <img
          class="hidden-xs"
          src="../assets/images/hero-carousel-2.jpg"
          alt="Digital Banking Innovation"
        />
        <img
          class="visible-xs"
          src="../assets/images/hero-carousel-2-mobile.jpg"
          alt="Digital Banking Innovation"
        />
      </div>
      <div class="custom-container">
        <div class="hc-content">
          <h2 class="hc-heading">Digital Banking Innovation</h2>
          <p class="hc-subheading">
            Empowering everyone with simple, secure, and smart banking
          </p>
          <a href="#" class="hc-cta button button-primary">Explore more</a>
        </div>
      </div>
    </article>
  </div>

  <!-- <div class="hc-controls">
    <button class="hc-prev" aria-label="Previous slide">‹</button>
    <button class="hc-next" aria-label="Next slide">›</button>
  </div> -->

  <div class="custom-container hc-dots-wrapper">
    <div class="hc-dots" role="tablist" aria-label="Hero slides"></div>
  </div>
</div>
